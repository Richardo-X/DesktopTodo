<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面待办 · 交互原型 v3.1（验收反馈修订版）</title>
<style>
:root{
  --accent:#0a63b8; --accent-hover:#0d6fc9; --accent-fg:#ffffff;
  --win-bg:rgba(243,246,251,.94);
  --card:rgba(255,255,255,.7); --card-border:rgba(0,0,0,.09); --card-solid:#f9fafc;
  --field:rgba(255,255,255,.9);
  --text:#1c1c1c; --muted:#666; --faint:#9a9a9a;
  --hover:rgba(0,0,0,.05); --active:rgba(0,0,0,.09);
  --btn:rgba(255,255,255,.75); --btn-border:rgba(0,0,0,.13); --btn-hover:#fff;
  --bubble-bg:#ffffff; --bubble-fg:#222;
  --danger:#c42b1c; --overdue:#d13438; --cb-border:#8a8a8a;
  --shadow:0 18px 60px rgba(5,15,35,.5);
}
[data-theme="night"]{
  --accent:#4cc2ff; --accent-hover:#6fcdff; --accent-fg:#06131c;
  --win-bg:rgba(30,30,33,.96);
  --card:rgba(255,255,255,.055); --card-border:rgba(255,255,255,.11); --card-solid:#2c2c2e;
  --field:rgba(255,255,255,.07);
  --text:#f0f0f0; --muted:#a4a4a4; --faint:#7a7a7a;
  --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.12);
  --btn:rgba(255,255,255,.08); --btn-border:rgba(255,255,255,.15); --btn-hover:rgba(255,255,255,.16);
  --bubble-bg:#3a3a3c; --bubble-fg:#f0f0f0;
  --cb-border:#9a9a9a;
}
*{box-sizing:border-box;transition:background-color .18s,color .18s,border-color .18s}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  color:#eef2f8;
  background:
    radial-gradient(1200px 800px at 78% 18%, rgba(90,150,255,.28), transparent 62%),
    radial-gradient(1000px 700px at 16% 85%, rgba(0,200,180,.16), transparent 60%),
    linear-gradient(160deg,#0b1420,#111c2e 55%,#0b1420);
}
.watermark{position:fixed;left:20px;top:14px;font-size:11px;color:rgba(255,255,255,.38);letter-spacing:1px;user-select:none;z-index:5}

/* ---------- 模拟通知栏（系统托盘区） ---------- */
#traybar{position:fixed;right:14px;bottom:12px;z-index:500;display:flex;align-items:center;gap:10px;
  padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  background:rgba(18,22,32,.72);backdrop-filter:blur(12px) saturate(1.2);box-shadow:0 10px 26px rgba(0,0,0,.38);
  user-select:none}
#traybar .tray-sys{display:flex;gap:5px;padding-right:8px;border-right:1px solid rgba(255,255,255,.14)}
#traybar .tray-sys .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.26)}
#trayIcon{position:relative;width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:7px;
  background:transparent;color:var(--accent);cursor:default;display:flex;align-items:center;justify-content:center}
#trayIcon:hover{background:rgba(255,255,255,.12)}
#trayIcon:active{background:rgba(255,255,255,.18)}
#trayIcon .tray-svg{width:22px;height:22px}
[data-theme="night"] #trayIcon{color:var(--accent)}
/* 已最小化到通知栏时的提示点 */
#trayIcon .tray-hidden-dot{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .2s}
#traybar.hidden-state #trayIcon .tray-hidden-dot{opacity:1}
#traybar .tray-clock{font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:.5px;min-width:44px;text-align:center}

/* 托盘右键菜单（模拟） */
#trayMenu{position:fixed;z-index:1100;min-width:150px;padding:5px;border-radius:8px;
  background:var(--card-solid);border:1px solid var(--card-border);box-shadow:0 12px 30px rgba(0,0,0,.35);display:none}
#trayMenu.show{display:block}
#trayMenu button{display:flex;width:100%;align-items:center;gap:8px;height:30px;padding:0 10px;border:none;border-radius:5px;
  background:transparent;color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;text-align:left}
#trayMenu button:hover{background:var(--hover)}
#trayMenu .sep{height:1px;margin:4px 6px;background:var(--card-border)}
#trayMenu button.danger{color:var(--danger)}

/* ---------- 组件簇与窗口 ---------- */
#cluster{position:absolute;z-index:10}
#cluster.tucked{transition:transform .28s ease}
#clusterZoom{zoom:1}
#panelsZoom{zoom:1}
.win{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;color:var(--text);
  background:var(--win-bg);backdrop-filter:blur(30px) saturate(1.2);
  border:1px solid rgba(255,255,255,.18);border-radius:10px;box-shadow:var(--shadow);
}
.win.child{border-color:rgba(255,255,255,.22)}
#mainWin{left:0;top:0;width:470px;height:640px}
#doneWin{width:310px;height:640px}
/* v3.1.1：两侧窗口阴影调小（12px 缝隙内不覆盖中间主窗） */
#doneWin,#quickWin{box-shadow:0 4px 12px rgba(5,15,35,.22)}
#quickWin{width:310px;height:640px}

/* 被模态窗口锁定 */
.win.blocked{pointer-events:none}
.win.blocked::before{content:'';position:absolute;inset:0;background:rgba(20,20,25,.20);z-index:998;border-radius:inherit}

/* 窗口缩放角 */
.resize-grip{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;z-index:60;
  opacity:.6;transition:opacity .15s}
.resize-grip::before{content:'';position:absolute;inset:0;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  border-bottom-right-radius:10px}   /* 弧度=窗口圆角 10px */
.resize-grip:hover{opacity:1}

.titlebar{height:36px;display:flex;align-items:center;padding-left:12px;flex:none;user-select:none;cursor:move;position:relative}
.titlebar::after{content:'';position:absolute;inset:0;cursor:move}
.titlebar>*{position:relative;z-index:1}
.titlebar .tb-left{display:flex;gap:7px;align-items:center;font-size:12.5px;pointer-events:none}
.tb-icon{width:17px;height:17px;border-radius:5px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.tb-icon svg{width:10px;height:10px}
.win-actions{margin-left:auto;display:flex;height:100%}
.wbtn{width:42px;height:100%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.wbtn svg{width:13px;height:13px}
.wbtn:hover{background:var(--hover)}
.wbtn.on{color:var(--accent)}   /* 开关类按钮（置顶 / 缩进锁定）的激活态 */
.wbtn.close:hover{background:#c42b1c;color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:10px 14px 24px}   /* 底部 24px：不与右下缩放角/按钮相互遮挡 */

/* ---------- 主窗口头部（时钟居中） ---------- */
.clock{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 10px}
.clock-time{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:1px}
.clock-date{font-size:12px;color:var(--muted)}
/* 操作区：两行网格（第1行 快捷添加 | 已完成；第2行 计数 | 批量删除 | ＋） */
.actions{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;padding-bottom:10px}
.a-bolt{grid-area:1/1/2/2;justify-self:start}
.a-chip{grid-area:2/1/3/2;justify-self:start}
.a-batch{grid-area:2/2/3/3}
.a-done{grid-area:1/3/2/4}
.a-add{grid-area:2/3/3/4}
.btn-stack{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.btn-row{display:flex;gap:7px}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.accent{background:var(--accent);color:var(--accent-fg)}
.icon-btn.accent:hover{background:var(--accent-hover)}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.cap-chip{font-size:11px;color:var(--muted);background:var(--hover);border-radius:99px;padding:3px 10px}

/* ---------- 事项行 ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.todo-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;position:relative;user-select:none;
  background:var(--card);border:1px solid var(--card-border)}
.todo-row:hover{border-color:var(--accent);background:var(--hover)}
.todo-row.dragging{opacity:.5;background:var(--active);border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:5}
.todo-row.leaving{opacity:0;transform:translateX(56px);transition:opacity .28s ease,transform .28s ease}
.grip{cursor:grab;color:var(--faint);display:flex;padding:5px 3px;border-radius:4px;touch-action:none;flex:none}
.grip:hover{color:var(--accent);background:var(--hover)}
.grip svg{width:13px;height:13px}
.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-size:13.5px;line-height:1.5;position:relative}
.tt-in{display:block;overflow:hidden}
.tt.trunc .tt-in{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 42px),rgba(0,0,0,0) calc(100% - 2px));
          mask-image:linear-gradient(90deg,#000 calc(100% - 42px),rgba(0,0,0,0) calc(100% - 2px));
}
.tt.trunc::after{content:'…';position:absolute;right:1px;top:0;color:var(--muted);opacity:.32;font-weight:700}
.tag{font-size:10px;border:1px solid currentColor;border-radius:99px;padding:0 6px;line-height:15px;flex:none;opacity:.95}
.tag.overdue{color:var(--overdue)}
.done-time{font-size:11px;color:var(--faint);flex:none}
.checkbox{width:20px;height:20px;flex:none;border:1.5px solid var(--cb-border);border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.checkbox:hover{border-color:var(--accent)}
.checkbox svg{width:12px;height:12px;stroke:var(--accent-fg);stroke-width:3;fill:none;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .25s ease .05s}
.checkbox.checked{background:var(--accent);border-color:var(--accent)}
.checkbox.checked:hover{background:var(--accent-hover)}
.checkbox.checked svg{stroke-dashoffset:0}
.plusbox{width:20px;height:20px;flex:none;border:1.5px solid var(--cb-border);border-radius:5px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.plusbox:hover{border-color:var(--accent);color:var(--accent);background:var(--hover)}
.plusbox svg{width:11px;height:11px}

.panel-head{display:flex;align-items:center;gap:6px;padding:0 2px 8px;flex:none}
.panel-title{font-size:13px;font-weight:600}
.panel-head .icon-btn{width:26px;height:26px;margin-left:auto}
.panel-head .icon-btn svg{width:13px;height:13px}
.panel-empty{color:var(--faint);font-size:12px;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.panel-empty.empty-big{font-size:17px;color:var(--muted);letter-spacing:5px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.empty-main{font-size:16px;color:var(--muted);letter-spacing:2px}
.empty-sub{font-size:11.5px;color:var(--faint)}
.foot-btn{flex:none;margin-top:8px}

/* ---------- 按钮 / 开关 / 表单 ---------- */
.btn{height:30px;padding:0 13px;border-radius:5px;border:1px solid var(--btn-border);background:var(--btn);color:var(--text);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover:not(:disabled){background:var(--btn-hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.danger:hover:not(:disabled){background:#a9271c} /* 决策#22：hover 深红，避免通用白底 hover 造成白底白字 */
.btn.danger-ghost{color:var(--danger);border-color:rgba(196,43,28,.55)}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.block{width:100%;justify-content:center}
.switch{width:40px;height:21px;border-radius:99px;border:1px solid var(--btn-border);background:var(--btn);position:relative;cursor:pointer;transition:.18s;padding:0;flex:none}
.switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.18s}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on .knob{left:21px;background:var(--accent-fg)}
.seg{display:flex;border:1px solid var(--btn-border);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--btn);color:var(--muted);font-size:11.5px;padding:5px 10px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.form-row{display:flex;align-items:center;gap:14px;padding:11px 0}
.form-label{flex:1;display:flex;flex-direction:column;gap:3px}
.form-label b{font-size:13px;font-weight:600}
.form-label span{font-size:11.5px;color:var(--muted);line-height:1.5}
.divider{height:1px;background:var(--card-border)}
textarea{width:100%;resize:none;border:1px solid var(--btn-border);border-radius:6px;background:var(--field);color:var(--text);padding:9px 11px;font-size:13px;font-family:inherit;line-height:1.6;outline:none}
textarea:focus{border-color:var(--accent)}
.counter{text-align:right;font-size:11px;color:var(--faint);margin-top:4px}
.counter.full{color:var(--danger)}
.form-actions{display:flex;gap:9px;margin-top:14px;align-items:center}
.spacer{flex:1}
.meta-line{font-size:11.5px;color:var(--muted);background:var(--hover);border-radius:6px;padding:7px 10px;margin-bottom:10px;line-height:1.5}
.stepper{display:flex;align-items:center;gap:6px}
.step-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--btn-border);background:var(--btn);color:var(--text);font-size:15px;cursor:pointer;line-height:1;font-family:inherit}
.step-btn:hover{background:var(--btn-hover)}
.stepper input,.stepper .val{width:52px;height:28px;text-align:center;border:1px solid var(--btn-border);border-radius:5px;background:var(--field);color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
input[type="date"]{height:28px;border:1px solid var(--btn-border);border-radius:5px;background:var(--field);color:var(--text);font-family:inherit;font-size:11.5px;padding:0 5px;outline:none}
input[type="date"]::-webkit-clear-button{display:none;-webkit-appearance:none;margin:0}
input[type="date"]::-webkit-inner-spin-button{display:none}

/* ---------- 气泡浮窗 ---------- */
.bubble{
  position:absolute;z-index:40;max-width:260px;display:none;
  background:var(--bubble-bg);color:var(--bubble-fg);padding:9px 12px;border-radius:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);border:1px solid var(--card-border);
  font-size:12.5px;line-height:1.7;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .15s,transform .15s;word-break:break-all;white-space:normal;
}
.bubble.on{display:block}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:'';position:absolute;right:-6px;top:var(--arrow-top,12px);border:6px solid transparent;border-left-color:var(--bubble-bg)}

/* ---------- 弹窗 / 提示 / 控制台 ---------- */
#modalHost{position:fixed;inset:0;z-index:900;pointer-events:none}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fade .15s}
.dialog{background:var(--card-solid);border:1px solid var(--card-border);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.4);width:min(380px,88vw);padding:19px 22px;animation:pop .16s}
.dlg-title{font-size:14.5px;font-weight:600;margin-bottom:8px;color:var(--text)}
.dlg-body{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:17px;word-break:break-all}
.dlg-btns{display:flex;justify-content:flex-end;gap:9px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:rgba(22,22,22,.93);color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:950;max-width:82vw}
.toast-btn{margin-left:12px;height:24px;padding:0 10px;border:none;border-radius:4px;background:var(--accent);color:var(--accent-fg);font-size:12px;cursor:pointer;font-family:inherit}
.toast-btn:hover{filter:brightness(1.15)}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
#devConsole{position:fixed;left:18px;bottom:18px;width:240px;background:rgba(14,17,26,.93);border:1px solid rgba(255,255,255,.13);border-radius:10px;color:#e8eaee;font-size:12px;z-index:960;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.dc-head{padding:9px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.dc-head .arr{color:#8b93a3;font-size:11px}
.dc-body{padding:2px 14px 13px;display:flex;flex-direction:column;gap:7px}
.dc-body button{height:28px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#e8eaee;font-size:11.5px;cursor:pointer;font-family:inherit}
.dc-body button:hover{background:rgba(255,255,255,.15)}
.dc-body button.warn{border-color:rgba(255,120,100,.5)}
.dc-note{color:#8b93a3;font-size:10.5px;line-height:1.6;margin:2px 0 0}
#devConsole.collapsed .dc-body{display:none}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= 适配层（后置覆盖，便于维护） ================= */
:root{--fs:1}                                   /* 字体缩放系数：设置中的“字体大小” */
/* 1) 字体大小跟随 --fs */
.clock-time{font-size:calc(30px * var(--fs))}
.clock-date{font-size:calc(12px * var(--fs))}
.cap-chip{font-size:calc(11px * var(--fs))}
.tt{font-size:calc(13.5px * var(--fs))}
.tag{font-size:calc(10px * var(--fs))}
.done-time{font-size:calc(11px * var(--fs))}
.panel-title{font-size:calc(13px * var(--fs))}
.panel-empty{font-size:calc(12px * var(--fs))}
.empty-main{font-size:calc(16px * var(--fs))}
.empty-sub{font-size:calc(11.5px * var(--fs))}
.btn{font-size:calc(12.5px * var(--fs))}
.btn.sm{font-size:calc(11.5px * var(--fs))}
.seg button{font-size:calc(11.5px * var(--fs))}
.form-label b{font-size:calc(13px * var(--fs))}
.form-label span{font-size:calc(11.5px * var(--fs))}
textarea{font-size:calc(13px * var(--fs))}
.counter{font-size:calc(11px * var(--fs))}
.meta-line{font-size:calc(11.5px * var(--fs))}
.stepper input,.stepper .val{font-size:calc(12.5px * var(--fs))}
input[type="date"]{font-size:calc(11.5px * var(--fs))}
.bubble{font-size:calc(12.5px * var(--fs))}
.dlg-title{font-size:calc(14.5px * var(--fs))}
.dlg-body{font-size:calc(12.5px * var(--fs))}
#toast{font-size:calc(12.5px * var(--fs))}
.titlebar .tb-left{font-size:calc(12.5px * var(--fs))}
.hint-sm{font-size:calc(11.5px * var(--fs))}

/* 2) v3.1：去除外框滚动条——body 不滚动，仅窗口内部/列表区滚动（验收反馈 #2） */
.win-body{overflow:auto}
.scroll{overflow:auto}

/* 3) 气泡浮窗：显示在事项卡片左侧（窗口外），不遮挡待办列表；尾部不再显示省略号 */
.tt.trunc::after{content:none}
/* 截断判定修复：内容用 inline-block 才能拿到“文本真实宽度”，块级元素的 scrollWidth 恒等于容器宽 */
.tt-in{display:inline-block;overflow:visible;white-space:nowrap}
.tt.trunc .tt-in{-webkit-mask-image:none;mask-image:none}
.tt.trunc{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 42px),rgba(0,0,0,0) calc(100% - 2px));
          mask-image:linear-gradient(90deg,#000 calc(100% - 42px),rgba(0,0,0,0) calc(100% - 2px))}
#gbubble{position:fixed;z-index:1200;display:none;max-width:300px;pointer-events:none;
  background:var(--bubble-bg);color:var(--bubble-fg);padding:9px 12px;border-radius:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);border:1px solid var(--card-border);
  font-size:calc(12.5px * var(--fs));line-height:1.7;word-break:break-all;white-space:normal;
  opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#gbubble.on{display:block}
#gbubble.show{opacity:1;transform:none}
#gbubble::after{content:'';position:absolute;right:-6px;top:var(--arrow-top,12px);border:6px solid transparent;border-left-color:var(--bubble-bg)}
#gbubble.flip::after{right:auto;left:-6px;top:var(--arrow-top,12px);border-left-color:transparent;border-right-color:var(--bubble-bg)}
#gbubble.below::after{right:auto;left:var(--ax,50%);margin-left:-6px;top:auto;bottom:-6px;border-left-color:transparent;border-top-color:var(--bubble-bg)}

/* 4) 批量删除 */
.todo-row.selrow{border-color:var(--accent);background:var(--hover)}
.selbox{width:19px;height:19px;flex:none;border:1.5px solid var(--cb-border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
.selbox.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.selbox svg{width:11px;height:11px;stroke-width:3}
.batch-bar{flex:none;display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--hover);font-size:calc(12px * var(--fs));color:var(--muted)}
.checkbox:disabled,.plusbox:disabled{opacity:.35;cursor:default}

/* 8) v3.1.2：窗口缩放时横向文字不换行（避免被挤成竖排） */
.btn,.wbtn,.icon-btn,.cap-chip,.tag,.done-time,.counter,.step-btn,.seg button,
.panel-title,.tb-left,.clock-time,.clock-date,.a-bolt,.a-chip,.a-batch,.a-done,.a-add,.a-add *,
.foot-note,.rec-time,.batch-bar,.empty-sub,.hint-sm,.wbtn.save,.todo-row,.done-row,.tpl-row,.rec-row{white-space:nowrap}

.checkbox.dim{background:transparent;color:var(--faint)}
.checkbox.dim::after{content:''}

/* 5) 标题栏「保存」按钮（占据原 × 的位置）与输入框右上角「清空」按钮 */
.wbtn.save{width:auto;padding:0 12px;font-size:calc(12px * var(--fs));font-family:inherit;color:var(--accent);font-weight:600}
.wbtn.save:hover{background:var(--accent);color:var(--accent-fg)}
.ta-wrap{position:relative}
.ta-wrap textarea{padding-right:58px}
.corner-btn{position:absolute;top:6px;right:6px;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--btn-border);
  background:var(--btn);color:var(--muted);font-size:calc(11px * var(--fs));font-family:inherit;cursor:pointer;line-height:1}
.corner-btn:hover{background:var(--btn-hover);color:var(--text)}
</style>
</head>
<body>
<div class="watermark">WINDOWS 11 桌面 · 交互原型 v3.1（验收反馈修订版 · 非正式软件）</div>

<div id="cluster">
 <div id="clusterZoom">
  <div id="panelsZoom">

  <!-- 主窗口：待办事项列表 -->
  <div class="win" id="mainWin">
    <div class="titlebar" id="mainDrag">
      <div class="tb-left"><span class="tb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>桌面待办</span></div>
      <div class="win-actions">

        <button class="wbtn close" id="closeBtn" title="缩小到通知栏（双击通知栏图标可恢复）"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

  </div>
 </div>

<div id="gbubble"><div class="bubble-text"></div></div>
<!-- 模拟通知栏（系统托盘）：正式版由系统托盘 API 提供，原型用右下角模拟 -->
<div id="traybar">

  </div>

    <button id="dcNextDay">模拟「跨过 24 点」（逾期标记＋结算归档）</button>

    <p class="dc-note">凡需求未定义的行为，本原型采用临时默认值，逐条列在《产品评审报告 v3》中，待你拍板。</p>
  </div>

<script>
(()=>{ 'use strict';
window.__err=[];window.addEventListener('error',e=>window.__err.push(String(e.message)));

/* ================= 工具 ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now();
const DAY=86400000, pad=n=>String(n).padStart(2,'0');
const WEEK=['日','一','二','三','四','五','六'];
const locISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDateStr=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const todayStr=()=>locISO(new Date(nowMs()));
const nowMs=()=>Date.now()+simOffset*DAY;
const dateOfMs=ms=>locISO(new Date(ms));
const CHAR_LIMIT=300, MAX_TPL=10;

/* ================= 状态 ================= */
const KEY='todo-proto-v5';   // v3.1：字段升版，避免旧存档缺字段
let state=null, simOffset=0;
const S=()=>state.settings;
/* 设置项默认值：读取旧存档时补齐缺失字段，避免出现 NaN 之类的问题 */
function defaults(){ return {maxItems:10,hour12:false,doneVisible:true,topMost:false,zoom:1,fontScale:1,   /* fontScale：小/中/大三档，1 = 中 */
  panelScale:1,tplScale:1,itemScale:1,histScale:1,setScale:1,tuckLock:false,autoStart:false,recycleKeep:'never'}; }   /* tuckLock：缩进锁定，开启后吸附边缘但不缩进 */

function seed(){
  const yd=dateOfMs(nowMs()-DAY), yd2=dateOfMs(nowMs()-2*DAY);
  state={
    settings:defaults(),
    pos:{x:Math.round(innerWidth*0.28),y:60},
    theme:'day', doneSort:'asc',
    lastSettleDate:yd,   // 种子设为昨天 → 首次启动立即补结算（归档发生在窗口出现之前）
    todos:[
      {id:uid(),content:'整理本周项目周报：汇总各模块进度与风险，更新里程碑计划，并发送给对接的项目组、测试组与部门负责人',createdAt:nowMs()-DAY,overdue:false},
      {id:uid(),content:'下午 3 点参加产品评审会议（3 楼会议室）',createdAt:nowMs()-DAY,overdue:false},
      {id:uid(),content:'整理桌面文件并清理下载文件夹',createdAt:nowMs()-DAY-3600e3,overdue:false}
    ],
    completed:[  // 昨天完成 → 启动结算时自动归档，当日已完成窗口为空
      {id:uid(),content:'回复客户的对接邮件',createdAt:nowMs()-2*DAY,completedAt:nowMs()-DAY-3*3600e3,overdue:true},
      {id:uid(),content:'晨间拉伸 10 分钟',createdAt:nowMs()-2*DAY,completedAt:nowMs()-DAY-5*3600e3,overdue:false}
    ],
    archive:{[yd2]:[
      {content:'提交上周差旅报销单',createdAt:nowMs()-3*DAY,completedAt:nowMs()-2*DAY-6*3600e3,overdue:false},
      {content:'阅读《产品方法论》30 页',createdAt:nowMs()-3*DAY,completedAt:nowMs()-2*DAY-4*3600e3,overdue:false}
    ]},
    templates:[
      {id:uid(),content:'喝水 8 杯',createdAt:nowMs()-3*DAY},
      {id:uid(),content:'整理邮箱收件箱',createdAt:nowMs()-3*DAY}
    ]
  };
  save();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify({v:4,state,simOffset}));}catch(e){} }
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&raw.v===4&&raw.state){
      state=raw.state; simOffset=raw.simOffset||0;
      state.settings=Object.assign(defaults(),state.settings||{});   // 补齐旧存档缺失的设置项
      state.settings.fontScale=nearestFontSpec(state.settings.fontScale).v;  // 旧的任意百分比吸附到三档之一
      return;
    }
  }catch(e){}
  seed();
}
function applyTheme(){ document.documentElement.dataset.theme=state.theme; }
/* 字体大小：固定三档（小 / 中 / 大），三选一 */
const FONT_SPECS=[{label:'小',v:0.85},{label:'中',v:1},{label:'大',v:1.2}];
function nearestFontSpec(v){
  const n=Number(v);
  if(!isFinite(n)||n<=0) return FONT_SPECS[1];
  return FONT_SPECS.reduce((a,b)=>Math.abs(b.v-n)<Math.abs(a.v-n)?b:a, FONT_SPECS[0]);
}
/* 字体大小（设置项）：只改文字，不改窗口尺寸 */
function applyFontScale(){
  const v=S().fontScale||1;
  document.documentElement.style.setProperty('--fs',v);
  requestAnimationFrame(()=>{ measureTrunc(document); updateDesktopExtent(); });
}
/* 缩放/拖动后内容超出可视区时，保证可以滚动查看（桌面级滚动兜底） */
function updateDesktopExtent(){
  const q=(typeof clusterRect==='function')?clusterRect():null;
  const needW=q?Math.ceil(q.r+8):0, needH=q?Math.ceil(q.b+8):0;
  document.documentElement.style.minWidth  = needW>innerWidth  ? needW+'px' : '';
  document.documentElement.style.minHeight = needH>innerHeight ? needH+'px' : '';
}

/* ================= 通用 UI ================= */
let toastT=null;
/* 普通提示：toast('消息')
   带操作按钮（如批量删除的撤销）：toast('消息', {label:'撤销', onClick:fn, duration:5000}) */
function toast(msg, action){
  const el=$('#toast');
  el.innerHTML='';
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(action&&action.label){
    const b=document.createElement('button'); b.className='toast-btn'; b.textContent=action.label;
    b.onclick=()=>{ clearTimeout(toastT); el.classList.remove('show'); action.onClick&&action.onClick(); };
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'), action? (action.duration||5000) : 2400);
}
function modal({title,body,buttons,parent}){
  const host=$('#modalHost');
  host.innerHTML=`<div class="mask"><div class="dialog" role="dialog" style="position:absolute">
    <div class="dlg-title">${esc(title)}</div>
    <div class="dlg-body">${body}</div>
    <div class="dlg-btns">${buttons.map((b,i)=>`<button class="btn ${b.kind||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>
  </div></div>`;
  // 弹窗位置跟随上一级窗口
  const dlg=host.querySelector('.dialog');
  const p=parent||(modalStack.length?document.getElementById(modalStack[modalStack.length-1]):null);
  if(p&&document.body.contains(p)){
    const r=p.getBoundingClientRect(), dw=dlg.offsetWidth||360, dh=dlg.offsetHeight||160;
    const left=Math.min(Math.max(8,r.left+(r.width-dw)/2),Math.max(8,innerWidth-dw-8));
    const top =Math.min(Math.max(8,r.top+56),Math.max(8,innerHeight-dh-8));
    dlg.style.left=left+'px'; dlg.style.top=top+'px';
  }else{
    dlg.style.left=Math.round((innerWidth-(dlg.offsetWidth||360))/2)+'px';
    dlg.style.top=Math.round((innerHeight-(dlg.offsetHeight||160))/2)+'px';
  }
  host.querySelectorAll('.dlg-btns .btn').forEach(btn=>btn.onclick=()=>{ const b=buttons[+btn.dataset.i]; host.innerHTML=''; b.onClick&&b.onClick(); });
}
/* 取某个元素所属窗口（用于弹窗跟随） */
function winOf(el){ return el ? (el.closest ? el.closest('.win') : null) : null; }

/* ================= 时间格式化 ================= */
function fmtTime(ms){
  const d=new Date(ms); let h=d.getHours(); const m=pad(d.getMinutes());
  if(S().hour12){ const ap=h<12?'上午':'下午'; h=h%12||12; return `${ap} ${h}:${m}`; }
  return `${pad(h)}:${m}`;
}
function fmtDateCN(ms){ const d=new Date(ms); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${WEEK[d.getDay()]}`; }
function fmtDateTime(ms){ return `${dateOfMs(ms)} ${fmtTime(ms)}`; }
function fmtTime24(ms){ const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* ================= 气泡浮窗（1 秒触发；显示在事项卡片左侧，不遮挡待办列表） ================= */
let bubTimer=null;
function hideBubble(){
  if(bubTimer){clearTimeout(bubTimer);bubTimer=null;}
  const b=$('#gbubble'); if(b) b.classList.remove('show','on');
}
/* 气泡是否压到待办事项列表内容（只避让列表，不再管其它窗口） */
function overlapsTodoList(r){
  const el=document.getElementById('todoList');
  if(!el) return false;
  const q=el.getBoundingClientRect();
  if(q.width<2||q.height<2) return false;
  return !(r.r<=q.left||r.l>=q.right||r.b<=q.top||r.t>=q.bottom);
}
function showBubble(row){
  const b=$('#gbubble'); if(!b) return;
  b.querySelector('.bubble-text').textContent=row.querySelector('.tt-in').dataset.full||'';
  b.classList.remove('flip','below');
  b.classList.add('on');
  const rr=row.getBoundingClientRect();
  const bw=b.offsetWidth, bh=b.offsetHeight;
  const M=8;
  const clampX=x=>Math.max(M,Math.min(x,innerWidth-bw-M));
  const cy=rr.top+rr.height/2;
  const mid=Math.max(M,Math.min(cy-bh/2,innerHeight-bh-M));
  // ① 首选：事项卡片左侧（窗口外 → 天然不压待办列表）
  const leftCand={l:rr.left-bw-14,t:mid,r:rr.left-14,b:mid+bh};
  let left=rr.left-bw-14, top=mid, mode='left';
  if(left<M || overlapsTodoList(leftCand)){
    // ② 卡片右侧（只要不压待办列表即可，不管是否压到快捷添加窗口）
    const rl=clampX(rr.right+14);
    const rightCand={l:rl,t:mid,r:rl+bw,b:mid+bh};
    if(!overlapsTodoList(rightCand)){ left=rl; mode='right'; }
    else{
      // ③ 该行上方（同窗口内，不压待办列表）
      const topUp=rr.top-bh-8;
      if(topUp>=M){ top=topUp; left=clampX(rr.right-bw); mode='up'; }
      else{ // ④ 上方也不够 → 放到行下方
        top=Math.min(innerHeight-bh-M, rr.bottom+8);
        left=clampX(rr.right-bw); mode='below';
      }
    }
  }
  b.style.left=left+'px'; b.style.top=top+'px';
  b.classList.toggle('flip',mode==='right');
  b.classList.toggle('below',mode==='below');
  if(mode==='up'||mode==='below') b.style.setProperty('--ax',Math.max(12,Math.min(rr.left+rr.width/2-left,bw-12))+'px');
  else b.style.setProperty('--arrow-top',Math.max(10,Math.min(cy-top-6,bh-12))+'px');
  requestAnimationFrame(()=>b.classList.add('show'));
}
function bindBubble(row){
  const tt=row.querySelector('.tt'); if(!tt) return;
  tt.addEventListener('mouseenter',()=>{
    if(!tt.classList.contains('trunc')) return;              // 未超出显示范围不触发
    if(bubTimer) clearTimeout(bubTimer);
    bubTimer=setTimeout(()=>{ if(tt.matches(':hover')&&tt.classList.contains('trunc')) showBubble(row); },1000);
  });
  tt.addEventListener('mouseleave',hideBubble);              // 鼠标离开文字即消失
}
function measureTrunc(root=document){
  root.querySelectorAll('.tt').forEach(tt=>{
    const inn=tt.querySelector('.tt-in');
    if(!inn) return;
    // 保留“至少一个字符”的间隔：间隔不足即按超出处理（字符宽约等于字号）
    const reserve=parseFloat(getComputedStyle(tt).fontSize)||13;
    tt.classList.toggle('trunc', inn.offsetWidth > tt.clientWidth - reserve);
  });
}

/* ================= 行模板 ================= */
const batch={mode:null,sel:new Set()};   // 批量删除模式（todos / templates），不持久化
let pendingUndo=null;                    // 上一次批量删除的暂存（5 秒撤销窗口内有效）
function undoBatchDelete(){
  if(!pendingUndo) return;
  const {kind, removed}=pendingUndo;
  const arr=kind==='templates'?state.templates:state.todos;
  // 按记录的原位置升序插回，恢复原顺序
  removed.slice().sort((a,b)=>a.index-b.index).forEach(({item,index})=>{
    arr.splice(Math.min(index,arr.length),0,item);
  });
  pendingUndo=null; save(); refresh(); toast('已撤销删除');
}
function todoRowHTML(t){
  const inBatch=batch.mode==='todos', sel=inBatch&&batch.sel.has(t.id);
  return `<div class="todo-row ${sel?'selrow':''}" data-id="${t.id}">
    ${inBatch?`<span class="selbox ${sel?'on':''}">${I.check}</span>`:`<div class="grip" title="按住拖动调整顺序">${I.grip}</div>`}
    <div class="tt"><span class="tt-in" data-full="${esc(t.content)}">${esc(t.content)}</span></div>
    ${t.overdue?'<span class="tag overdue">逾期</span>':''}
    <button class="checkbox" title="标记完成" ${inBatch?'disabled':''}>${I.check}</button>
  </div>`;
}
function doneRowHTML(it,interactive){
  const ov=dateOfMs(it.createdAt)!==dateOfMs(it.completedAt);   // 与详情页“完成情况”同一判定口径，避免列表与详情不一致
  return `<div class="todo-row" data-key="${it.completedAt}">

/* ================= 模态层级：只有最上层弹窗可操作；有小窗口时组件保持弹出 ================= */
const modalStack=[];
let mouseInside=true;
function updateModality(){
  hideBubble();

/* ================= 子窗口工厂（独立移动；组内共享缩放；每次打开回到默认位置） ================= */
let zTop=20, cascade=0;
const R={};
const GROUP_BASE={}; // id -> {w,h}
function openChild(id,{title,group,w,h,back,onBack,noClose,saveBtn,render}){
  let win=document.getElementById(id);
  const fresh=!win;
  if(fresh){
    win=document.createElement('div');
    win.className='win child'; win.id=id;
    win.dataset.group=group; win.dataset.bw=w; win.dataset.bh=h;
    GROUP_BASE[id]={w,h};
    const sc=S()[group+'Scale']||1;
    win.style.width=Math.round(w*sc)+'px'; win.style.height=Math.round(h*sc)+'px';
    win.innerHTML=`<div class="titlebar">
        ${back?`<button class="wbtn back" title="返回" style="width:34px">${I.chevL}</button>`:''}
        <div class="tb-left"><span style="pointer-events:none">${title}</span></div>
        <div class="win-actions"></div>
      </div><div class="win-body"></div><div class="resize-grip" title="拖动等比例缩放（同组窗口共享大小设置）"></div>`;
    $('#clusterZoom').appendChild(win);
    const tb=win.querySelector('.titlebar');
    const bk=tb.querySelector('.back'); if(bk) bk.addEventListener('click',e=>{e.stopPropagation();onBack&&onBack();});
    bindSelfDrag(tb,win);
    bindGroupResize(win,group,w,h);
    cascade++;
    const anchor=Math.round(470*S().panelScale);
    win.style.left=Math.max(10,Math.round((anchor-w)/2)+(cascade%5)*26)+'px';
    win.style.top=(34+(cascade%5)*24)+'px';
    win.addEventListener('pointerdown',()=>{ win.style.zIndex=++zTop; });
  }
  // 标题栏右侧动作区：每次打开都重建，避免窗口复用时残留上一个按钮
  //   saveBtn 有值 → 用「保存」按钮占据原 × 的位置；noClose → 不显示关闭按钮；否则显示 ×
  const actions=win.querySelector('.win-actions');
  actions.innerHTML = saveBtn
    ? `<button class="wbtn save" title="${saveBtn.title||'保存'}">${esc(saveBtn.label||'保存')}</button>`
    : (noClose ? '' : `<button class="wbtn close" title="关闭">${I.x}</button>`);
  const closeEl=actions.querySelector('.close');
  if(closeEl) closeEl.addEventListener('click',()=>closeWin(id));
  const saveEl=actions.querySelector('.save');
  if(saveEl) saveEl.addEventListener('click',e=>{ e.stopPropagation(); saveBtn.onClick&&saveBtn.onClick(); });
  win.style.display='flex'; win.style.zIndex=++zTop;
  const i=modalStack.indexOf(id); if(i>=0) modalStack.splice(i,1);
  modalStack.push(id); updateModality();
  R[id]=render; render(win.querySelector('.win-body'));
  requestAnimationFrame(()=>{ updateDesktopExtent(); measureTrunc(document); });
  return win;
}
function closeWin(id){
  const w=document.getElementById(id); if(w) w.remove();
  delete R[id]; delete GROUP_BASE[id];
  const i=modalStack.indexOf(id); if(i>=0) modalStack.splice(i,1);
  updateModality();
}
function refreshChildren(){
  for(const id in R){
    if(/^(addWin|edit-|tedit-|settingsWin)/.test(id)) continue;  // 表单窗口保留输入状态
    const w=document.getElementById(id); if(w) R[id](w.querySelector('.win-body'));
  }
}

/* 子窗口自身拖动（与面板解绑，位置不记忆，每次打开回默认位） */
function bindSelfDrag(tb,win){
  tb.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.wbtn')) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY;
    const ox=parseFloat(win.style.left)||0, oy=parseFloat(win.style.top)||0;
    const z=S().zoom||1;
    const move=ev=>{ win.style.left=(ox+(ev.clientX-sx)/z)+'px'; win.style.top=(oy+(ev.clientY-sy)/z)+'px'; };
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}
/* 组内共享缩放 */
function bindGroupResize(win,group,bw,bh){
  const grip=win.querySelector('.resize-grip');
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0) return; e.preventDefault(); e.stopPropagation();
    const sx=e.clientX, s0=S()[group+'Scale']||1;
    const w0=win.getBoundingClientRect().width;
    if(w0<10) return;
    const move=ev=>setGroupScale(group, s0*((w0+ev.clientX-sx)/w0));
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}
function setGroupScale(group,v){
  // 规则：缩放结果超过屏幕任意一边（宽或高）即禁止放大
  const wins=$$('#clusterZoom .win.child').filter(w=>w.dataset.group===group);
  if(wins.length){
    const cap=Math.min(1.6,...wins.map(w=>Math.min(
      (innerWidth-24)/(+w.dataset.bw||360),
      (innerHeight-24)/(+w.dataset.bh||360))));
    if(v>cap){ v=cap; toast('已达最大尺寸（缩放不超过屏幕宽高）'); }
  }
  v=Math.round(Math.max(0.7,v)*20)/20;
  S()[group+'Scale']=v; save();
  wins.forEach(w=>{
    const bw=+w.dataset.bw, bh=+w.dataset.bh;
    w.style.width=Math.round(bw*v)+'px'; w.style.height=Math.round(bh*v)+'px';
  });
  measureTrunc(document); updateDesktopExtent();
}

/* ================= 已完成反选 → 退回待办（放最后） ================= */
function restoreItem(key){
  const idx=state.completed.findIndex(x=>String(x.completedAt)===String(key));
  if(idx<0) return;
  const it=state.completed[idx];
  if(state.todos.length>=S().maxItems){ toast('未完成待办已达上限，请先完成待办或进入设置更改上限'); return; }
  state.completed.splice(idx,1);

  save(); refresh(); toast('已退回待办列表（末尾）');
}

/* ================= 长按拖拽排序 ================= */
function flipRows(cont,mutate){
  const before=new Map([...cont.querySelectorAll('.todo-row')].map(r=>[r.dataset.id||r.dataset.key,r.getBoundingClientRect().top]));
  mutate();
  [...cont.querySelectorAll('.todo-row')].forEach(r=>{
    const b=before.get(r.dataset.id||r.dataset.key); if(b==null) return;
    const dy=b-r.getBoundingClientRect().top; if(Math.abs(dy)<2) return;
    r.style.transition='none'; r.style.transform=`translateY(${dy}px)`;
    requestAnimationFrame(()=>{ r.style.transition='transform 130ms ease'; r.style.transform=''; });
  });
}
function bindGrip(grip,listSel,kind){
  if(!grip) return;
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.preventDefault(); untuck();
    const row=grip.closest('.todo-row');
    const cont=$(listSel); if(!cont) return;
    const startX=e.clientX,startY=e.clientY; let lastY=e.clientY;
    let started=false, srcIdx=[...cont.children].findIndex(n=>n===row);
    const nodes=()=>[...cont.querySelectorAll('.todo-row')];
    const timer=setTimeout(()=>{ started=true; row.classList.add('dragging'); hideBubble(); },230);
    const arr=()=> kind==='templates'?state.templates:state.todos;
    const onMove=ev=>{
      if(!started){ return; }   // v3.1.2：长按 230ms 后进入拖动，期间移动不再取消（修复"拖拽无法使用"）
      const y=ev.clientY;
      const dy=y-lastY; if(Math.abs(dy)<2) return; lastY=y;
      const swapAdj=(dir)=>{   // v3.1.1：与相邻条目交换（触碰其边缘 4px 内即换位），带 FLIP 动画
        const ns=nodes(), src=ns[srcIdx], dst=ns[srcIdx+dir];
        if(!dst) return;
        const a=arr(); const tmp=a[srcIdx]; a[srcIdx]=a[srcIdx+dir]; a[srcIdx+dir]=tmp;
        const before=new Map(ns.map(n=>[n.dataset.id||n.dataset.key, n.getBoundingClientRect().top]));
        if(dir>0) cont.insertBefore(src, dst.nextSibling); else cont.insertBefore(src, dst);
        srcIdx+=dir;
        flipRows(cont, ()=>{
          ns.forEach(n=>{ const k=n.dataset.id||n.dataset.key; const b0=before.get(k); if(b0==null) return;
            const dy2=b0-n.getBoundingClientRect().top; if(Math.abs(dy2)<2) return;
            n.style.transition='none'; n.style.transform=`translateY(${dy2}px)`;
            requestAnimationFrame(()=>{ n.style.transition='transform 130ms ease'; n.style.transform=''; });
          });
        });
      };
      if(dy>0){ const below=nodes()[srcIdx+1]; if(below){ const r=below.getBoundingClientRect(); if(y>r.top+4) swapAdj(1); } }
      else if(dy<0){ const above=nodes()[srcIdx-1]; if(above){ const r=above.getBoundingClientRect(); if(y<r.bottom-4) swapAdj(-1); } }
    };
    const cleanup=()=>{
      clearTimeout(timer);
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
      window.removeEventListener('pointercancel',onUp);
      row.classList.remove('dragging');
      save();
    };
    const onUp=()=>cleanup();
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
  });
}

/* ---------- 导出 / 导入 ---------- */
const CSV_HEAD=['完成日期','完成时间','事项内容','创建时间','完成时间'];
function csvCell(s){ s=String(s??''); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function collectRange(from,to){
  const out=[];
  Object.keys(state.archive).sort().forEach(ds=>{
    if(ds>=from&&ds<=to) state.archive[ds].forEach(it=>out.push(it));
  });
  const t=todayStr();
  if(t>=from&&t<=to) state.completed.forEach(it=>out.push(it));
  return out.sort((a,b)=>a.completedAt-b.completedAt);
}
function exportCSV(from,to,minDate,today){
  if(from>to){ toast('导出范围无效：起始日期晚于结束日期'); return; }
  from=from<minDate?minDate:from; to=to>today?today:to;
  const rows=collectRange(from,to);
  if(!rows.length){ toast('选定范围内没有完成记录'); return; }
  const lines=[CSV_HEAD.join(',')];
  rows.forEach(it=>lines.push([
    dateOfMs(it.completedAt), fmtTime24(it.completedAt), it.content, fmtTime24(it.createdAt), fmtTime24(it.completedAt)
  ].map(csvCell).join(',')));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`待办完成记录_${from}_${to}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`已导出 ${rows.length} 条记录（CSV / UTF-8）`);
}
function parseCSVLine(line){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function handleImport(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const text=rd.result.replace(/^\uFEFF/,'');
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      let start=0;
      if(lines[0]&&lines[0].includes('完成日期')) start=1;
      const recs=[];
      for(let i=start;i<lines.length;i++){
        const c=parseCSVLine(lines[i]);
        if(c.length<3||!c[0].match(/^\d{4}-\d{2}-\d{2}$/)) continue;
        const d=c[0], tm=c[1]||'00:00', content=c[2]||'';
        const [hh,mm]=(tm.split(':'));
        const completedAt=parseDateStr(d).getTime()+(+hh)*3600e3+(+mm)*60e3;
        let createdAt=completedAt;
        if(c[3]&&/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(c[3])){
          const [dd,tt2]=c[3].split(' '); const [h2,m2]=tt2.split(':');
          createdAt=parseDateStr(dd).getTime()+(+h2)*3600e3+(+m2)*60e3;
        }
        recs.push({content,createdAt,completedAt});
      }
      if(!recs.length){ toast('没有解析到有效记录（需要 UTF-8 CSV）'); return; }
      const keyOf=r=>`${dateOfMs(r.completedAt)}|${fmtTime24(r.completedAt)}|${r.content}`;
      const existing=new Map();
      Object.values(state.archive).flat().forEach(r=>existing.set(keyOf(r),r));
      state.completed.forEach(r=>existing.set(keyOf(r),r));
      const fresh=recs.filter(r=>!existing.has(keyOf(r)));
      const dups=recs.filter(r=>existing.has(keyOf(r)));
      const apply=(overwrite)=>{
        let added=0,over=0;
        fresh.forEach(r=>{ addToArchive(r); added++; });
        if(overwrite) dups.forEach(r=>{ removeFromArchive(r); addToArchive(r); over++; });
        save(); refresh();
        toast(`导入完成：新增 ${added} 条${dups.length?(overwrite?`，覆盖 ${over} 条`:`，保留原记录 ${dups.length} 条`):''}`);
      };
      if(!dups.length){ apply(false); return; }
      modal({title:'发现重复记录',body:`导入的记录中有 ${dups.length} 条与现有记录重复（完成日期、时间、内容相同）。如何处理重复记录？`,parent:$('#settingsWin'),buttons:[
        {label:'保留当前记录',onClick:()=>apply(false)},
        {label:'覆盖导入',kind:'primary',onClick:()=>apply(true)}
      ]});
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  rd.readAsText(file,'utf-8');
}
function addToArchive(r){
  const ds=dateOfMs(r.completedAt);
  if(ds===todayStr()) state.completed.push({id:uid(),content:r.content,createdAt:r.createdAt,completedAt:r.completedAt,overdue:!!r.overdue});
  else (state.archive[ds]??=[]).push({content:r.content,createdAt:r.createdAt,completedAt:r.completedAt,overdue:!!r.overdue});
}
function removeFromArchive(r){
  const ds=dateOfMs(r.completedAt);
  if(ds===todayStr()) state.completed=state.completed.filter(x=>!(x.content===r.content&&x.completedAt===r.completedAt));
  else if(state.archive[ds]) state.archive[ds]=state.archive[ds].filter(x=>!(x.content===r.content&&x.completedAt===r.completedAt));
}

/* ================= 跨天结算（幂等；启动时在窗口渲染前执行） ================= */
function settle(){
  const today=todayStr();
  if(state.lastSettleDate===today) return 0;          // 防重复结算
  let moved=0;
  state.completed=state.completed.filter(it=>{
    const ds=dateOfMs(it.completedAt);
    if(ds!==today){ (state.archive[ds]??=[]).push({content:it.content,createdAt:it.createdAt,completedAt:it.completedAt,overdue:!!it.overdue}); moved++; return false; }
    return true;
  });
  state.todos.forEach(t=>{ t.overdue=true; });        // 昨天未完成 → 逾期；当日新建事项排在其后
  state.lastSettleDate=today;
  purgeRecycle();
  save();
  return moved;
}
function settleAndNotify(){
  const moved=settle();
  refresh();
  if(moved) toast(`跨天结算：${moved} 条已完成事项已归档，未完成事项已标记逾期`);
}

/* ================= 组件簇：拖动 / 吸附 / 缩进 / 缩放 ================= */
let dragging=false, tucked=false, tuckTimer=null;
const cluster=$('#cluster');
const z=()=>S().zoom;
function applyPos(){ const c=$('#cluster'); c.style.left=state.pos.x+'px'; c.style.top=state.pos.y+'px'; }
function clampPos(){
  const r=$('#mainWin').getBoundingClientRect();
  state.pos.x=Math.min(Math.max(state.pos.x,-r.width+90),innerWidth-90);
  state.pos.y=Math.min(Math.max(state.pos.y,0),innerHeight-50);
  applyPos();
}
/* 组件簇（含面板与子窗口）的实际外接矩形，用于判断是否需要桌面滚动 */
function clusterRect(){
  const wins=[...document.querySelectorAll('#clusterZoom .win')].filter(w=>w.style.display!=='none'&&w.offsetParent!==null);
  if(!wins.length) return null;
  let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
  wins.forEach(w=>{ const q=w.getBoundingClientRect(); l=Math.min(l,q.left+scrollX); t=Math.min(t,q.top+scrollY); r=Math.max(r,q.right+scrollX); b=Math.max(b,q.bottom+scrollY); });
  return {l,t,r,b,w:r-l,h:b-t};
}
function applyZoom(v){
  v=Math.round(Math.min(1.25,Math.max(0.75,v))*20)/20;
  const wAll=(470+(S().doneVisible?282:0)+($('#quickWin').style.display!=='none'?322:0))*v;
  if(wAll>innerWidth-16){ toast('已达最大宽度（不超过屏幕宽度）'); return; }
  S().zoom=v; save();
  $('#clusterZoom').style.zoom=v;
  clampPos(); snapCheck(true);
}
function applyPanelScale(v){
  // 规则：缩放结果超过屏幕任意一边（宽或高）即禁止放大
  const baseW=470+(S().doneVisible?282:0)+($('#quickWin').style.display!=='none'?322:0);
  const maxW=(innerWidth-24)/baseW;
  const maxH=(innerHeight-24)/640;          // 三面板等高（640），以最高者为准
  let maxV=Math.min(maxW,maxH);
  if(maxV<0.7) maxV=0.7;                    // 极小屏幕兜底：保住最小档，交给滚动
  v=Math.round(Math.min(1.4,Math.max(0.7,v))*20)/20;
  if(v>maxV){
    v=Math.floor(maxV*20)/20;
    if(v<0.7) v=0.7;
    toast('已达最大尺寸（缩放不超过屏幕宽高）');
  }
  S().panelScale=v; save();
  $('#panelsZoom').style.zoom=v;
  clampPos(); snapCheck(true); measureTrunc(document); updateDesktopExtent();
}
function snapCheck(silent){
  if(dragging) return;
  const r=$('#mainWin').getBoundingClientRect();
  let snapped=null;
  if(state.pos.y<=26) snapped='top';
  else if(state.pos.y+r.height>=innerHeight-26) snapped='bottom';
  if(snapped){ state.pos.y=snapped==='top'?0:Math.round(innerHeight-r.height); applyPos(); }
  cluster._snapped=snapped;
  if(!snapped) untuck();
}
function tuck(){
  if(dragging) return;
  if(S().tuckLock) return;        // 缩进锁定开启：吸附后保持弹出，不缩进
  if(modalStack.length) return;   // 有小窗口打开时，组件即使在桌面边缘也保持弹出状态
  const snap=cluster._snapped; if(!snap) return;
  const r=$('#mainWin').getBoundingClientRect();
  tucked=true;
  cluster.classList.add('tucked');
  cluster.style.transform=snap==='top'?`translateY(${-(r.height-12)}px)`:`translateY(${r.height-12}px)`;
}
function untuck(){
  clearTimeout(tuckTimer); tuckTimer=null;
  if(tucked){ tucked=false; cluster.style.transform=''; }
}
function bindClusterDrag(tb){
  tb.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.wbtn')) return;
    e.preventDefault(); dragging=true; untuck();
    const sx=e.clientX, sy=e.clientY, ox=state.pos.x, oy=state.pos.y;
    const move=ev=>{
      state.pos.x=ox+ev.clientX-sx; state.pos.y=oy+ev.clientY-sy;
      clampPos(); cluster._snapped=null;
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      dragging=false; snapCheck(); save(); updateDesktopExtent();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  });
}
function bindPanelGrip(){
  const grip=$('#panelGrip');
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0) return; e.preventDefault(); e.stopPropagation();
    const sx=e.clientX, s0=S().panelScale||1;
    const w0=$('#mainWin').getBoundingClientRect().width;
    if(w0<10) return;
    const move=ev=>applyPanelScale(s0*((w0+ev.clientX-sx)/w0));
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}
function layout(){
  const d=$('#doneWin');
  d.style.left='476px'; d.style.top='0px';
  d.style.display=S().doneVisible?'flex':'none';

function tick(){
  const t=$('#clockTime'), d=$('#clockDate');
  if(t){
    const now=nowMs();
    t.textContent=fmtTime(now);
    d.textContent=fmtDateCN(now);
  }

/* ================= 通知栏（托盘）显隐 ================= */
let trayHidden=false, trayBusy=false;
function trayIconCenter(){
  const t=document.getElementById('trayIcon');
  if(!t) return {x:innerWidth-60,y:innerHeight-30};
  const r=t.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}
/* 缩小到通知栏：整体等比缩小并位移向托盘图标，动画结束后隐藏 */
function minimizeToTray(){
  if(trayHidden||trayBusy) return;
  trayBusy=true;
  const r=cluster.getBoundingClientRect();
  const c=trayIconCenter();
  const sx=Math.max(0.04, 30/Math.max(r.width,1));
  const dx=c.x-(r.left+r.width/2), dy=c.y-(r.top+r.height/2);
  untuck();
  cluster.style.transformOrigin='50% 50%';
  cluster.style.transition='transform .32s cubic-bezier(.5,.02,.7,.2), opacity .32s ease';
  cluster.style.transform=`translate(${dx}px,${dy}px) scale(${sx})`;
  cluster.style.opacity='0';
  setTimeout(()=>{
    cluster.style.display='none';
    cluster.style.transition=''; cluster.style.transform=''; cluster.style.opacity='';
    trayHidden=true; trayBusy=false;
    const bar=document.getElementById('traybar'); if(bar) bar.classList.add('hidden-state');
    const tg=document.getElementById('trayToggle'); if(tg) tg.textContent='显示';
    toast('已缩小到通知栏，双击通知栏图标可恢复');
  },330);
}
/* 从通知栏恢复：反向播放动画 */
function restoreFromTray(){
  if(!trayHidden||trayBusy) return;
  trayBusy=true;
  const c=trayIconCenter();
  cluster.style.display='';
  const r=cluster.getBoundingClientRect();
  const sx=Math.max(0.04, 30/Math.max(r.width,1));
  const dx=c.x-(r.left+r.width/2), dy=c.y-(r.top+r.height/2);
  cluster.style.transformOrigin='50% 50%';
  cluster.style.transition='none';
  cluster.style.transform=`translate(${dx}px,${dy}px) scale(${sx})`;
  cluster.style.opacity='0';
  requestAnimationFrame(()=>{
    cluster.style.transition='transform .34s cubic-bezier(.2,.7,.3,1), opacity .34s ease';
    cluster.style.transform=''; cluster.style.opacity='';
    setTimeout(()=>{
      cluster.style.transition=''; cluster.style.transformOrigin='';
      trayHidden=false; trayBusy=false;
      const bar=document.getElementById('traybar'); if(bar) bar.classList.remove('hidden-state');
      const tg=document.getElementById('trayToggle'); if(tg) tg.textContent='隐藏';
      clampPos(); snapCheck(true); updateDesktopExtent(); measureTrunc(document);
    },350);
  });
}

/* ================= 全局 ================= */
document.addEventListener('pointerdown',hideBubble,true);
let rzT=null;
new ResizeObserver(()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ measureTrunc(document); snapCheck(true); },150); }).observe($('#clusterZoom'));

/* ================= 演示控制台 ================= */
$('#dcToggle').onclick=()=>{ const c=$('#devConsole'); c.classList.toggle('collapsed'); $('#dcArr').textContent=c.classList.contains('collapsed')?'▸':'▾'; };
$('#dcNextDay').onclick=()=>{ simOffset++; save(); settleAndNotify(); };
$('#dcReset').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); };

/* ================= 启动 ================= */
load();
applyTheme();
settle();                    // 启动补结算：先归档/标逾期，再渲染窗口（已完成窗口首帧即为空）
bindChrome();
applyPos();
layout();
$('#clusterZoom').style.zoom=z();
$('#panelsZoom').style.zoom=S().panelScale||1;
$('#pinBtn').classList.toggle('on',S().topMost);
if(S().tuckLock) untuck();   // 旧存档若已开启缩进锁定，启动时保证不是缩进状态
refresh();
applyFontScale();
updateDesktopExtent();
window._proto={ handleImport, collectRange, settle, state:()=>state, closeWin, clusterRect, applyFontScale };
})();
